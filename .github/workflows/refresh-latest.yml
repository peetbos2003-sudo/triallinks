name: Refresh latest.json

on:
  schedule:
    # 01:17 & 08:17 UTC, Mon-Fri. GitHub fires scheduled runs 4-7h late, so the
    # early run lands ~07:00-09:30 Amsterdam; the 08:17 one is a midday catch-up.
    - cron: '17 1 * * 1-5'
    - cron: '17 8 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape latest publications and rebuild latest.json + icc/latest.json
        env:
          STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
        run: node scripts/refresh-latest.mjs

      - name: Commit and push (race-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Two files: ECR (root) and ICC (icc/). Untracked icc/latest.json counts as a change too.
          if git diff --quiet -- latest.json icc/latest.json && [ -z "$(git status --porcelain -- icc/latest.json)" ]; then
            echo "No change in latest.json or icc/latest.json."
            exit 0
          fi
          mkdir -p /tmp/refresh/icc
          cp latest.json /tmp/refresh/latest.json
          cp icc/latest.json /tmp/refresh/icc/latest.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p icc
            cp /tmp/refresh/latest.json latest.json
            cp /tmp/refresh/icc/latest.json icc/latest.json
            git add latest.json icc/latest.json
            if git diff --staged --quiet; then
              echo "Remote already up to date."
              exit 0
            fi
            git commit -m "Auto-refresh latest.json (ECR + ICC)"
            if git push origin HEAD:main; then
              echo "Pushed."
              exit 0
            fi
            echo "Push race detected; re-syncing and retrying ($i of 5)..."
            sleep 4
          done
          echo "Failed to push after 5 retries" >&2
          exit 1
